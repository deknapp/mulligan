name: pages

# Publishes site/ — the primer and format tools — as static files. Posts and
# the simulated data are rendered from blog/ by `mulligan site` (the
# simulations take minutes to hours on a laptop). Once a day it also fetches
# the set's live 17Lands numbers, so the tools switch from simulated to real
# card win rates on their own as the format is played.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/mulligan/site/live.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on for the repository the first time this runs.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Real results for the tools; before release this writes an empty file.
      # A 17Lands outage must not block publishing the simulated tools.
      - run: python3 src/mulligan/site/live.py fra site/data || echo "17Lands fetch failed"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
