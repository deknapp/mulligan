[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mulligan"
version = "0.1.0"
description = "A rules-strict Magic: The Gathering engine and a benchmark for LLM agents that have to play it"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nathaniel Knapp" }]
keywords = [
    "magic-the-gathering", "mtg", "game-engine", "rules-engine", "simulation",
    "ai-agents", "llm-agents", "benchmark", "agent-evaluation", "claude",
    "anthropic", "imperfect-information", "game-ai", "sequential-decision-making",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# The LLM agent. The engine, the baselines and the whole benchmark harness run
# without this: an agent you cannot evaluate offline is an agent you cannot
# debug.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = ["mulligan[llm,dev]"]

[project.urls]
Homepage = "https://github.com/deknapp/mulligan"
Repository = "https://github.com/deknapp/mulligan"
Issues = "https://github.com/deknapp/mulligan/issues"

[project.scripts]
mulligan = "mulligan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mulligan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: test calls a live LLM API (deselect with -m 'not llm')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options with function calls in argument defaults, which is
# exactly what B008 forbids. The rule is right in general and wrong here.
"src/mulligan/cli.py" = ["B008"]
